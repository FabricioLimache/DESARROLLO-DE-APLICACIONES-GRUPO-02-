<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Experiencia 02 - Componentes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light p-5">

    <!-- Tarjeta principal -->
    <div class="card shadow-lg m-3">

        <!-- Imagen de perfil -->
        <div class="text-center p-3">
            <img
                src="https://via.placeholder.com/100"
                alt="Perfil"
                class="rounded-circle">
        </div>

        <!-- Contenido de la tarjeta -->
        <div class="card-body text-center">

            <h3 class="bg-primary text-white p-2">Juan Pérez</h3>
            <p class="text-muted">Ingeniero de Software</p>

            <!-- Lista de habilidades -->
            <ul class="list-group mb-3">
                <li class="list-group-item">React &amp; Angular</li>
                <li class="list-group-item">Python (Reflex)</li>
                <li class="list-group-item">Bases de Datos</li>
            </ul>

            <!-- Botón de contacto -->
            <a href="#" class="btn btn-primary w-100">Contactar</a>

        </div>

    </div>

</body>

</html>
