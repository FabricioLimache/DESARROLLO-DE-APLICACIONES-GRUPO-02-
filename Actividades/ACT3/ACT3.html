<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School timetable</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 2em;
    }

    h1 {
      font-size: 2em;
    }

    /* ---------- Estilo básico de la tabla ---------- */
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
    }

    th, td {
      border: 1px solid #999;
      padding: 0.8em 1em;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    caption {
      caption-side: bottom;
      margin-top: 0.5em;
      font-size: 0.9em;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>School timetable</h1>

  <!-- ========================================================
       PASO 1 y 2: Recreamos la tabla base de horario (igual a
       timetable.html) con sus filas y columnas, pero SIN
       información de estilo en las columnas todavía.
  ========================================================= -->
  <table>

    <!-- ========================================================
         PASO 3: <colgroup> se coloca justo debajo de <table> y
         antes de las filas <tr>. Dentro de él van los elementos
         <col>, uno por cada columna de la tabla en orden.
         Cada <col> permite definir el estilo de UNA columna
         completa en un solo lugar, en vez de repetir el atributo
         style en cada <td>/<th> de esa columna.
    ========================================================= -->
    <colgroup>
      <!-- PASO 4: las dos primeras columnas (la de encabezados de
           fila "1st period"... y la columna "Mon") se dejan sin
           estilo, por eso van vacías. -->
      <col>
      <col>

      <!-- PASO 5: tercera columna = "Tues". Se le da un color de
           fondo verde. -->
      <col style="background-color:#97DB9A;">

      <!-- PASO 6: cuarta columna = "Wed". No lleva color, solo se
           le fija un ancho angosto porque no tiene clases. -->
      <col style="width:42px;">

      <!-- PASO 7: quinta columna = "Thurs". Mismo verde que Tues,
           porque también es un día con clases. -->
      <col style="background-color:#97DB9A;">

      <!-- PASO 8: sexta columna = "Fri". Es un día especial (se
           enseña un idioma distinto todo el día), así que se
           resalta con un color de fondo diferente y un borde
           llamativo alrededor de toda la columna. -->
      <col style="background-color:#DCC48E; border:4px solid #C1437A;">

      <!-- PASO 9: las dos últimas columnas ("Sat" y "Sun") están
           libres, así que no llevan color de fondo, solo se les
           da el mismo ancho angosto que a "Wed". -->
      <col style="width:42px;">
      <col style="width:42px;">
    </colgroup>

    <!-- ========================================================
         Fila de encabezados de columna: la celda vacía de la
         esquina + los 7 días de la semana. Cada <th> corresponde,
         en orden, a un <col> del colgroup de arriba.
    ========================================================= -->
    <tr>
      <th></th>
      <th>Mon</th>
      <th>Tues</th>
      <th>Wed</th>
      <th>Thurs</th>
      <th>Fri</th>
      <th>Sat</th>
      <th>Sun</th>
    </tr>

    <!-- ========================================================
         Filas de datos: cada <tr> es un periodo de clase.
         El primer <th> de cada fila es el encabezado de esa
         fila (ej. "1st period"), y los <td> siguientes son las
         materias dictadas ese día en ese periodo (vacíos si no
         hay clase).
    ========================================================= -->
    <tr>
      <th>1st period</th>
      <td>English</td>
      <td></td>
      <td></td>
      <td>German</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <tr>
      <th>2nd period</th>
      <td>English</td>
      <td>English</td>
      <td></td>
      <td>German</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <tr>
      <th>3rd period</th>
      <td></td>
      <td>German</td>
      <td></td>
      <td>German</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <tr>
      <th>4th period</th>
      <td></td>
      <td>English</td>
      <td></td>
      <td>English</td>
      <td>Dutch</td>
      <td></td>
      <td></td>
    </tr>

    <caption>Tabla N° 2: Tabla de horario de cursos de idiomas.</caption>
  </table>

</body>
</html>
