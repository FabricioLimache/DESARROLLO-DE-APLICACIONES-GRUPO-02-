<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio Lumen - Contacto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="header-principal">
    <a href="index.html" class="logo">Estudio Lumen</a>
    <nav class="nav-principal" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html" aria-current="page">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="seccion" id="formulario-contacto">
      <h1>Hablemos de tu proyecto</h1>
      <p>Completa el formulario y te responderemos en menos de 48 horas.</p>

      <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="proyecto">Cuéntanos sobre tu proyecto</label>
        <textarea id="proyecto" name="proyecto" rows="5" required></textarea>

        <button type="submit" class="btn-animado">Enviar mensaje</button>
      </form>
    </section>

    <section class="seccion">
      <h2>Otros medios de contacto</h2>
      <ul class="lista-contacto">
        <li>Correo: hola@estudiolumen.pe</li>
        <li>Teléfono: +51 999 888 777</li>
        <li>Ubicación: Lima, Perú</li>
      </ul>
    </section>
  </main>

  <footer class="pie">
    <p>&copy; 2026 Estudio Lumen. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
