<!DOCTYPE html>
<!-- Indica que estamos trabajando con HTML5 -->

<html lang="es">
<!-- Inicio del documento HTML y se establece el idioma español -->

<head>

    <meta charset="UTF-8">
    <!-- Permite utilizar correctamente caracteres especiales -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite adaptar la página a diferentes tamaños de pantalla -->

    <title>Colores mediante código hexadecimal</title>
    <!-- Título que aparecerá en la pestaña del navegador -->

    <link rel="stylesheet" href="coloreshexadecimal.css">
    <!-- Vincula este documento HTML con el archivo CSS -->

</head>

<body>

    <h1 class="titulo">
        Configuración de colores mediante código hexadecimal
    </h1>
    <!-- Título principal que utiliza un color hexadecimal -->


    <p class="parrafo">
        Este párrafo utiliza un color de fondo definido
        mediante código hexadecimal.
    </p>
    <!-- Párrafo cuyo fondo utiliza un código hexadecimal -->


    <div class="caja">
        Esta caja utiliza un código hexadecimal
        para definir el color de su borde.
    </div>
    <!-- Caja cuyo borde utiliza un código hexadecimal -->

</body>

</html>
