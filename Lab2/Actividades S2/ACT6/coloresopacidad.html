<!DOCTYPE html>
<!-- Indica que estamos trabajando con HTML5 -->

<html lang="es">
<!-- Inicio del documento HTML y se establece el idioma español -->

<head>

    <meta charset="UTF-8">
    <!-- Permite utilizar correctamente caracteres especiales -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite adaptar la página a diferentes tamaños de pantalla -->

    <title>Colores con opacidad</title>
    <!-- Título que aparecerá en la pestaña del navegador -->

    <link rel="stylesheet" href="coloresopacidad.css">
    <!-- Vincula este documento HTML con el archivo CSS -->

</head>

<body>

    <h1 class="titulo">
        Configuración de colores con opacidad
    </h1>
    <!-- Título principal que utiliza un color con opacidad -->


    <p class="parrafo">
        Este párrafo utiliza un color de fondo con
        un nivel de opacidad del 70%.
    </p>
    <!-- Párrafo cuyo fondo utiliza un color con opacidad -->


    <div class="caja">
        Esta caja utiliza un borde de color azul
        con un nivel de opacidad del 40%.
    </div>
    <!-- Caja cuyo borde utiliza un color con opacidad -->

</body>

</html>
