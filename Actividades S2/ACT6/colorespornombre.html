<!DOCTYPE html>
<!-- Indica que estamos trabajando con HTML5 -->

<html lang="es">
<!-- Inicio del documento HTML y se establece el idioma español -->

<head>

    <meta charset="UTF-8">
    <!-- Permite utilizar correctamente caracteres como á, é, í, ó y ú -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->

    <title>Utilización de colores por nombre</title>
    <!-- Título que aparecerá en la pestaña del navegador -->

    <link rel="stylesheet" href="colorespornombre.css">
    <!-- Vincula este documento HTML con el archivo CSS -->

</head>

<body>

    <h1 class="titulo">
        Utilización de colores mediante nombres
    </h1>

    <p class="parrafo">
        Este párrafo utiliza un color de fondo mediante el nombre
        del color en CSS.
    </p>

    <div class="caja">
        Este elemento tiene un borde cuyo color ha sido definido
        utilizando el nombre del color en CSS.
    </div>

</body>

</html>
